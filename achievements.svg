<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Columns -->
    <linearGradient id="grad-column" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08080a" />
      <stop offset="100%" stop-color="#101013" />
    </linearGradient>

    <!-- Faint Glow Filter -->
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse-dot {
      0%, 100% { fill-opacity: 0.4; r: 3.5px; }
      50% { fill-opacity: 1; r: 5px; }
    }
    @keyframes float-icon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes spin-slow {
      to { transform: rotate(360deg); }
    }

    .bg {
      fill: #000000;
    }
    .panel {
      fill: url(#grad-column);
      stroke: #1f1f23;
      stroke-width: 1;
      rx: 8px;
    }
    .panel:hover {
      stroke: #4364F7;
    }
    .section-title {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }
    .primary-text {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e1e4e8;
    }
    .secondary-text {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 10.5px;
      fill: #8e8e93;
    }
    .timeline-dot {
      fill: #4364F7;
      animation: pulse-dot 2.5s infinite ease-in-out;
    }
    .timeline-dot-green {
      fill: #38ef7d;
      animation: pulse-dot 2.2s infinite ease-in-out;
    }
    .timeline-line {
      stroke: #222226;
      stroke-width: 1.5;
    }
    .star-icon {
      fill: #ffbd2e;
      transform-origin: 790px 42px;
      animation: spin-slow 20s linear infinite;
    }
    .trophy-container {
      animation: float-icon 3s infinite ease-in-out;
      transform-origin: center;
    }
  </style>

  <!-- Backdrop -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Column 1: Academic Foundation -->
  <g transform="translate(30, 15)">
    <rect width="380" height="130" class="panel" />
    <text x="20" y="28" class="section-title">🎓 ACADEMIC FOUNDATION</text>
    
    <!-- Timeline line -->
    <line x1="25" y1="48" x2="25" y2="105" class="timeline-line" />

    <!-- SVCT -->
    <g transform="translate(0, 0)">
      <circle cx="25" cy="55" r="4.5" class="timeline-dot" />
      <text x="40" y="58" class="primary-text">B.E. Computer Science &amp; Engineering</text>
      <text x="40" y="73" class="secondary-text">Sri Venkateswaraa College of Technology (2021 – 2025)</text>
    </g>

    <!-- CGPA -->
    <g transform="translate(0, 38)">
      <circle cx="25" cy="55" r="4.5" class="timeline-dot-green" />
      <text x="40" y="58" class="primary-text">Academic Standing: 7.9 / 10 CGPA</text>
      <text x="40" y="73" class="secondary-text">Solid foundation in algorithms, databases, and system design</text>
    </g>
  </g>

  <!-- Column 2: Achievements & Leadership -->
  <g transform="translate(440, 15)">
    <rect width="380" height="130" class="panel" />
    <text x="20" y="28" class="section-title">🏆 ACHIEVEMENTS &amp; LEADERSHIP</text>
    
    <!-- Hackathon Winner -->
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="primary-text">Kings Engineering College Hackathon Winner</text>
      <text x="0" y="27" class="secondary-text">First place honors (₹15,000 cash prize)</text>
    </g>

    <!-- Student Club Leadership -->
    <g transform="translate(20, 90)">
      <text x="0" y="12" class="primary-text">President, Programmers' Club &amp; CSE Association</text>
      <text x="0" y="27" class="secondary-text">Led technical workshops, events, and mentored 100+ peers</text>
    </g>

    <!-- Spinning star graphic -->
    <path d="M 790,32 L 793,39 L 800,40 L 795,45 L 796,52 L 790,48 L 784,52 L 785,45 L 780,40 L 787,39 Z" class="star-icon" />
  </g>
</svg>
