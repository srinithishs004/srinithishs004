<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#141417" />
    </pattern>

    <!-- Faint Glow Filter -->
    <filter id="glow-ambient" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes log-loop {
      0%, 8% { transform: translateY(0); }
      12%, 20% { transform: translateY(-16px); }
      24%, 32% { transform: translateY(-32px); }
      36%, 44% { transform: translateY(-48px); }
      48%, 56% { transform: translateY(-64px); }
      60%, 68% { transform: translateY(-80px); }
      72%, 80% { transform: translateY(-96px); }
      84%, 92% { transform: translateY(-112px); }
      96%, 100% { transform: translateY(-128px); }
    }
    @keyframes code-type {
      0%, 20% { opacity: 0; }
      25%, 100% { opacity: 1; }
    }

    /* Styles */
    .bg {
      fill: #000000;
    }
    .grid-bg {
      fill: url(#grid);
    }
    .ambient-blue {
      fill: #4364F7;
      opacity: 0.25;
      filter: url(#glow-ambient);
      animation: pulse-glow 6s infinite ease-in-out;
    }
    
    /* Typography */
    .text-title {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-weight: 800;
      font-size: 34px;
      fill: #ffffff;
    }
    .text-subtitle {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #8e8e93;
      letter-spacing: 1px;
    }
    .text-tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      fill: #4364F7;
    }
    
    /* IDE Frame */
    .ide-window {
      fill: #09090b;
      stroke: #1f1f23;
      stroke-width: 1.5;
      rx: 8px;
    }
    .ide-header {
      fill: #121215;
      stroke: #1f1f23;
      stroke-width: 1;
      rx: 8px; /* matching window */
    }
    .terminal-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      fill: #6e6e73;
    }
    
    /* Syntax Highlighting */
    .code-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #e1e4e8;
    }
    .keyword { fill: #ff7b72; }
    .property { fill: #79c0ff; }
    .string { fill: #a5d6ff; }
    .comment { fill: #8b949e; }
    .value { fill: #d2a8ff; }
    .success { fill: #38ef7d; }
    .warn { fill: #ffbd2e; }

    /* Animation classes */
    .cursor {
      fill: #79c0ff;
      animation: blink 1s infinite;
    }
    .log-container {
      animation: log-loop 16s infinite cubic-bezier(0.25, 1, 0.5, 1);
    }
  </style>

  <!-- 1. Backgrounds -->
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" class="grid-bg" />

  <!-- 2. Ambient light glow around IDE -->
  <circle cx="630" cy="130" r="120" class="ambient-blue" />

  <!-- 3. Left Side: Brand Info -->
  <g transform="translate(50, 65)">
    <text x="0" y="30" class="text-title">SRI NITHISH S</text>
    <text x="0" y="65" class="text-subtitle">SOFTWARE ENGINEER • CLOUD ENGINEER • OPEN SOURCE</text>
    <text x="0" y="105" class="text-tagline">&gt; Building software that solves real-world problems.</text>
    <text x="0" y="135" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4e4e52">github.com/srinithishs004</text>
  </g>

  <!-- 4. Right Side: Premium IDE Code and Terminal Window -->
  <g transform="translate(460, 30)">
    <!-- IDE Box -->
    <rect width="350" height="200" class="ide-window" />
    <!-- Header panel -->
    <rect width="350" height="28" class="ide-header" />
    
    <!-- OS Control Dots -->
    <circle cx="16" cy="14" r="4.5" fill="#ff5f56" />
    <circle cx="28" cy="14" r="4.5" fill="#ffbd2e" />
    <circle cx="40" cy="14" r="4.5" fill="#27c93f" />
    
    <!-- Tab title -->
    <text x="60" y="17" class="terminal-title">infra.tf — srinithishs004</text>
    
    <!-- Syntax Highlighted Code block -->
    <g transform="translate(18, 52)" class="code-text" xml:space="preserve">
      <text x="0" y="0"><tspan class="keyword">resource</tspan> <tspan class="string">"aws_ecs_service"</tspan> <tspan class="string">"app"</tspan> {</text>
      <text x="15" y="16"><tspan class="property">name</tspan>            = <tspan class="string">"nithish-service"</tspan></text>
      <text x="15" y="32"><tspan class="property">cluster</tspan>         = <tspan class="property">aws_ecs_cluster.main.id</tspan></text>
      <text x="15" y="48"><tspan class="property">task_definition</tspan> = <tspan class="property">aws_ecs_task.app.arn</tspan></text>
      <text x="15" y="64"><tspan class="property">desired_count</tspan>   = <tspan class="value">3</tspan></text>
      <text x="0" y="80">}</text>
    </g>

    <!-- Console separator line -->
    <line x1="0" y1="142" x2="350" y2="142" stroke="#1f1f23" stroke-width="1.5" />

    <!-- Terminal Console Pane -->
    <g transform="translate(18, 142)">
      <!-- Clip-path to hide overflowing logs -->
      <clipPath id="console-clip">
        <rect x="0" y="5" width="315" height="48" />
      </clipPath>
      
      <g clip-path="url(#console-clip)">
        <g class="log-container" transform="translate(0, 15)">
          <!-- Dynamic Log Lines -->
          <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8e8e93">$ terraform apply --auto-approve</text>
          <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8e8e93">[17:38:01] <tspan class="property">aws_ecs_service.app</tspan>: Creating...</text>
          <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38ef7d">[17:38:05] aws_ecs_service.app: Creation complete! [ID: ecs-01]</text>
          <text x="0" y="48" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8e8e93">$ docker build -t app-node:latest .</text>
          <text x="0" y="64" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8e8e93">Sending build context to Docker daemon  2.048MB</text>
          <text x="0" y="80" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38ef7d">Successfully tagged app-node:latest 🐳</text>
          <text x="0" y="96" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8e8e93">$ npm run test -- --passWithNoTests</text>
          <text x="0" y="112" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38ef7d">PASS  test/api.test.ts (4.81s) [12 passed]</text>
          <text x="0" y="128" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38ef7d">Deploy complete! Running dynamically... 🚀</text>
          <text x="0" y="144" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8e8e93">$ <tspan class="cursor" fill="#79c0ff">_</tspan></text>
        </g>
      </g>
    </g>
  </g>
</svg>
