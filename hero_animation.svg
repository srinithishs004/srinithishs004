<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Background Dot Grid -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#1e1e24" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="60%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#6FB1FC" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a0a0a0" />
    </linearGradient>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    @keyframes node-pulse {
      0%, 100% { r: 5px; fill-opacity: 0.6; filter: drop-shadow(0 0 2px #4364F7); }
      50% { r: 8px; fill-opacity: 1; filter: drop-shadow(0 0 8px #6FB1FC); }
    }
    @keyframes flow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes line-draw {
      to { stroke-dashoffset: 0; }
    }

    /* Styles */
    .bg {
      fill: #000000;
    }
    .grid-bg {
      fill: url(#grid);
      opacity: 0.6;
    }
    .text-title {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-weight: 800;
      font-size: 34px;
      fill: url(#text-grad);
      animation: fade-in 1s ease-out forwards;
    }
    .text-subtitle {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-weight: 500;
      font-size: 14px;
      fill: #8e8e93;
      letter-spacing: 1px;
      animation: fade-in 1.2s ease-out forwards;
    }
    .text-tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      fill: #6FB1FC;
      animation: fade-in 1.5s ease-out forwards;
    }
    .glow-circle {
      fill: #0052D4;
      opacity: 0.12;
      filter: url(#glow-heavy);
      animation: pulse 4s infinite ease-in-out;
      transform-origin: 650px 130px;
    }
    .flow-line {
      stroke: url(#grad-blue);
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 8, 8;
      animation: flow 1.5s linear infinite;
    }
    .solid-line {
      stroke: #1c1c1e;
      stroke-width: 1.5;
      fill: none;
    }
    .network-node {
      fill: #6FB1FC;
      animation: node-pulse 3s infinite ease-in-out;
    }
    .network-node-green {
      fill: #38ef7d;
      animation: node-pulse 2.5s infinite ease-in-out;
    }
    
    /* Tech Icon Badges */
    .badge {
      fill: #0c0c0e;
      stroke: #1c1c1e;
      stroke-width: 1;
      rx: 6px;
    }
    .badge-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      fill: #8e8e93;
    }
  </style>

  <!-- 1. Backdrop -->
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" class="grid-bg" />

  <!-- 2. Ambient Glow (Right Side) -->
  <circle cx="650" cy="130" r="140" class="glow-circle" />

  <!-- 3. Left Side: Typography -->
  <g transform="translate(50, 65)">
    <!-- Main Name -->
    <text x="0" y="30" class="text-title">SRI NITHISH S</text>
    
    <!-- Roles -->
    <text x="0" y="65" class="text-subtitle">SOFTWARE ENGINEER • OPEN SOURCE • CLOUD INFRASTRUCTURE</text>
    
    <!-- Tagline (Typing Style) -->
    <text x="0" y="105" class="text-tagline">&gt; Building software that solves real-world problems.</text>
    
    <!-- Sub-links or Profile Tag -->
    <text x="0" y="135" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4e4e52">github.com/srinithishs004</text>
  </g>

  <!-- 4. Right Side: Animated Git & Cloud Topology -->
  <g transform="translate(0, 0)">
    <!-- Base Infrastructure Grid Lines -->
    <path d="M 520,130 L 780,130" class="solid-line" />
    <path d="M 580,130 L 630,70 L 720,70 L 750,130" class="solid-line" />
    <path d="M 580,130 L 630,190 L 720,190 L 750,130" class="solid-line" />
    
    <!-- Flowing Git Streams / Pipelines -->
    <path d="M 520,130 L 780,130" class="flow-line" />
    <path d="M 580,130 L 630,70 L 720,70 L 750,130" class="flow-line" style="animation-delay: -0.5s;" />
    <path d="M 580,130 L 630,190 L 720,190 L 750,130" class="flow-line" style="animation-delay: -1s;" />

    <!-- Interconnected Pulsing Nodes -->
    <circle cx="580" cy="130" class="network-node" style="animation-delay: 0s;" />
    <circle cx="630" cy="70" class="network-node" style="animation-delay: -0.6s;" />
    <circle cx="720" cy="70" class="network-node" style="animation-delay: -1.2s;" />
    <circle cx="630" cy="190" class="network-node" style="animation-delay: -0.4s;" />
    <circle cx="720" cy="190" class="network-node" style="animation-delay: -1.8s;" />
    <circle cx="750" cy="130" class="network-node-green" style="animation-delay: -0.9s;" />
    
    <!-- Node Labels / System Architecture Elements -->
    <g transform="translate(630, 50)" text-anchor="middle">
      <rect x="-35" y="-12" width="70" height="18" class="badge" />
      <text y="0" class="badge-text">CI/CD Run</text>
    </g>
    <g transform="translate(720, 50)" text-anchor="middle">
      <rect x="-30" y="-12" width="60" height="18" class="badge" />
      <text y="0" class="badge-text">AWS ECS</text>
    </g>
    <g transform="translate(630, 215)" text-anchor="middle">
      <rect x="-30" y="-12" width="60" height="18" class="badge" />
      <text y="0" class="badge-text">Docker</text>
    </g>
    <g transform="translate(720, 215)" text-anchor="middle">
      <rect x="-30" y="-12" width="60" height="18" class="badge" />
      <text y="0" class="badge-text">Postgres</text>
    </g>
    <g transform="translate(580, 150)" text-anchor="middle">
      <text font-family="'JetBrains Mono', monospace" font-size="9" fill="#5c5c64">Source</text>
    </g>
    <g transform="translate(775, 150)" text-anchor="middle">
      <text font-family="'JetBrains Mono', monospace" font-size="9" fill="#38ef7d">Deploy</text>
    </g>
  </g>
</svg>
